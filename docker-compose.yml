# Backend completo: Postgres + migraciones/seeds + 3 microservicios + API Gateway.
#   cp .env.docker.example .env   (y completa los secretos)
#   docker compose up -d --build
# Solo el gateway se publica (puerto ${GATEWAY_PORT:-3000}); el resto queda en la red interna.

x-backend: &backend
  build:
    context: .
    target: runtime
  image: ${BACKEND_IMAGE:-huerto-backend}:${BACKEND_TAG:-latest}
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}

x-storage-env: &storage-env
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  LOCAL_STORAGE_DIR: uploads
  S3_BUCKET: ${S3_BUCKET:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  ASSETS_BASE_URL: ${ASSETS_BASE_URL:-http://localhost:3000/uploads}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: users_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-products-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Se ejecuta en cada `up`, aplica migraciones pendientes y seeds (idempotentes) y termina.
  migrate:
    build:
      context: .
      target: migrate
    image: ${BACKEND_IMAGE:-huerto-backend}-migrate:${BACKEND_TAG:-latest}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*db-env, *storage-env]
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      ADMIN_FULLNAME: ${ADMIN_FULLNAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads

  users:
    <<: *backend
    command: ["node", "dist/apps/users-service/main.js"]
    environment:
      <<: *db-env
      DB_DATABASE: users_db

  products:
    <<: *backend
    command: ["node", "dist/apps/products-service/main.js"]
    environment:
      <<: [*db-env, *storage-env]
      DB_DATABASE: products_db
    volumes:
      - uploads:/app/uploads

  auth:
    <<: *backend
    command: ["node", "dist/apps/auth-service/main.js"]
    environment:
      USERS_SERVICE_HOST: users
      USERS_SERVICE_PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET en .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET en .env}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}

  gateway:
    <<: *backend
    command: ["node", "dist/apps/huerto-hogar-backend/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      users:
        condition: service_started
      products:
        condition: service_started
      auth:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      <<: *storage-env
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      USERS_SERVICE_HOST: users
      USERS_SERVICE_PORT: 3001
      PRODUCTS_SERVICE_HOST: products
      PRODUCTS_SERVICE_PORT: 3002
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: 3003
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
